name: Deploy to Aliyun

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "css/*,js/*,fonts/*,images/*,essays/*.html,index.html,essays.html,gallery.html,about.html,favicon.svg"
          target: /var/www/nilset
          strip_components: 0
          overwrite: true
