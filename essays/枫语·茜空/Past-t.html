      <h1>蝶恋花·归何处</h1>
      <p class="meta">2024-12-20 · 枫语·茜空</p>
      <p>云落沉山山艳艳，<br>不见其归，<br>点降洪流诞。<br>天雾渐旋情具丏，<br>孤舟远过乘风便。</p>
<p>此去无回，<br>绳缚终香散。<br>先帝始觉新事鲜，<br>收绝无限思中怨。</p>
